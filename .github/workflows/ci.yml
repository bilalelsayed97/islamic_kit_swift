name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (strict concurrency)
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Test
        run: swift test --parallel
      - name: iOS simulator tests
        run: |
          # Pick a simulator from xcodebuild's own destination list so the
          # chosen id is always one this Xcode can run tests on.
          DEST_ID=$(xcodebuild -scheme IslamicKitPlus-Package -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' | grep -v placeholder \
            | grep -o 'id:[0-9A-F-]*' | head -1 | cut -d: -f2)
          test -n "$DEST_ID" || { echo "No iOS simulator destination available"; exit 1; }
          echo "Using iOS simulator id $DEST_ID"
          xcodebuild -scheme IslamicKitPlus-Package \
            -destination "platform=iOS Simulator,id=$DEST_ID" \
            -derivedDataPath .build/xcode test
      - name: Pod lint
        run: pod lib lint IslamicKitPlus.podspec --allow-warnings --skip-tests --platforms=ios,macos
