name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (strict concurrency)
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Test
        run: swift test --parallel
      - name: iOS simulator tests
        run: |
          DEST_ID=$(./tool/ios-simulator-id.sh) || {
            echo "Could not pick an iOS simulator; available devices:"
            xcrun simctl list devices available
            exit 1
          }
          echo "Using iOS simulator id $DEST_ID"
          xcodebuild -scheme IslamicKitPlus-Package \
            -destination "platform=iOS Simulator,id=$DEST_ID" \
            -destination-timeout 180 \
            -derivedDataPath .build/xcode test
      - name: Pod lint
        run: pod lib lint IslamicKitPlus.podspec --allow-warnings --skip-tests --platforms=ios,macos
